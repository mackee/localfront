# Dependencies for the spa-hosting example: an S3-compatible object store
# (RustFS) seeded with the build output. localfront itself runs on the host:
#
#   docker compose up -d
#   docker compose run --rm seed
#   localfront serve --template template.yaml \
#     --s3-endpoint http://localhost:9000 \
#     --s3-access-key rustfsadmin --s3-secret-key rustfsadmin
#
# `task verify:spa` automates the whole flow and runs scenario.yaml with runn.
name: localfront-spa-hosting

services:
  rustfs:
    image: ${LOCALFRONT_E2E_S3_IMAGE:-rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c}
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"

  # One-shot uploader (excluded from `up` by its profile; run explicitly).
  seed:
    image: amazon/aws-cli:2.31.18@sha256:1a491b258590cc66866cd550f592edff80082f44daf1d903820daeca2f4954de
    profiles: [seed]
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_EC2_METADATA_DISABLED: "true"
      NO_PROXY: rustfs
      no_proxy: rustfs
    volumes:
      - ./dist:/assets:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        attempt=0
        until aws s3api list-buckets >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then echo "object store did not become ready" >&2; exit 1; fi
          sleep 1
        done
        aws s3api head-bucket --bucket spa-assets 2>/dev/null || aws s3 mb s3://spa-assets
        aws s3 cp /assets/ s3://spa-assets/ --recursive
        echo "seeded spa-assets"
