# Dependencies for the spa-hosting example: an S3-compatible object store
# (RustFS) seeded with the build output. localfront itself runs on the host:
#
#   docker compose up -d
#   docker compose run --rm seed
#   localfront serve --template template.yaml \
#     --s3-endpoint http://localhost:9000 \
#     --s3-access-key rustfsadmin --s3-secret-key rustfsadmin
#
# `task verify:spa` automates the whole flow and runs scenario.yaml with runn.
name: localfront-spa-hosting

services:
  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot uploader (excluded from `up` by its profile; run explicitly).
  seed:
    image: amazon/aws-cli:2.31.18@sha256:1a491b258590cc66866cd550f592edff80082f44daf1d903820daeca2f4954de
    profiles: [seed]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      NO_PROXY: rustfs
      no_proxy: rustfs
    volumes:
      - ./dist:/assets:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket spa-assets 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3 mb s3://spa-assets
        aws --endpoint-url http://rustfs:9000 s3 cp /assets/ s3://spa-assets/ --recursive
        echo "seeded spa-assets"
