# Dependencies for the static-and-api example: an S3-compatible object store
# (RustFS) for the static assets, seeded from ./public, plus a small HTTP
# backend standing in for the /api/* origin. localfront runs on the host.
#
# `task verify:static-and-api` automates the flow and runs scenario.yaml.
name: localfront-static-and-api

services:
  rustfs:
    image: ${LOCALFRONT_E2E_S3_IMAGE:-rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c}
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"

  # Stand-in API backend for the /api/* cache behavior.
  backend:
    image: hashicorp/http-echo:1.0.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
    command: ["-text=api-backend", "-listen=:3000"]
    ports:
      - "3000:3000"

  # One-shot uploader (excluded from `up` by its profile; run explicitly).
  seed:
    image: amazon/aws-cli:2.31.18@sha256:1a491b258590cc66866cd550f592edff80082f44daf1d903820daeca2f4954de
    profiles: [seed]
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_EC2_METADATA_DISABLED: "true"
      NO_PROXY: rustfs
      no_proxy: rustfs
    volumes:
      - ./public:/assets:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        attempt=0
        until aws s3api list-buckets >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then echo "object store did not become ready" >&2; exit 1; fi
          sleep 1
        done
        aws s3api head-bucket --bucket site-assets 2>/dev/null || aws s3 mb s3://site-assets
        aws s3 cp /assets/ s3://site-assets/ --recursive
        echo "seeded site-assets"
